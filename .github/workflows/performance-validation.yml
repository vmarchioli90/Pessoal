name: Performance Evidence Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-performance-evidence:
    name: Validate performance evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate JMX, evaluator and platform launcher
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('blazedemo-performance-tests/jmeter/blazedemo-load-test.jmx'); ET.parse('blazedemo-performance-tests/jmeter/blazedemo-spike-test.jmx')"
          node --check scripts/run-performance.js
          node --check blazedemo-performance-tests/scripts/evaluate-performance.js
          node scripts/run-performance.js load --check-only
          node scripts/run-performance.js spike --check-only

      - name: Validate POSIX shell syntax
        shell: bash
        run: |
          bash -n blazedemo-performance-tests/scripts/run-load-test.sh
          bash -n blazedemo-performance-tests/scripts/run-spike-test.sh

      - name: Recalculate load acceptance
        run: node blazedemo-performance-tests/scripts/evaluate-performance.js load blazedemo-performance-tests/results/load-test-results.jtl --ramp-up-seconds=30 --output=validation-output/load-validation.md

      - name: Recalculate spike acceptance
        run: node blazedemo-performance-tests/scripts/evaluate-performance.js spike blazedemo-performance-tests/results/spike-test-results.jtl --output=validation-output/spike-validation.md

      - name: Upload recalculated summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-evidence-validation-${{ runner.os }}
          path: validation-output/
          if-no-files-found: warn
          retention-days: 7
